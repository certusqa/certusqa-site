# Public-repo leak gate.
#
# Everything committed here is published: Cloudflare Pages serves this
# directory from its root, so a mistake is live on certusqa.com before anyone
# reviews it. The rules this enforces were already written down — in
# .gitignore, in the four-repo rule file, and in NOTES.md as a manual grep run
# before pushing. A gate a human has to remember is a gate that holds until the
# day it matters.
name: Leak gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The engine is private IP. No path into qa/ai/core should appear in a
      # repo that is served to the public internet.
      # Checks for engine source, NOT for mentions of it — and excludes this
      # file, which contains every pattern it searches for.
      #
      # Two lessons are baked in here. A grep-based gate living in the tree it
      # scans matches its own source unless it excludes itself; the first
      # version of this file failed on exactly that. And the ops console's
      # equivalent step failed on its own .cursor rules and on a wiki page whose
      # purpose is to describe the engine — proving that "mentions the path" and
      # "contains the code" are different questions, and only the second one is
      # a leak.
      - name: No engine source files
        run: |
          set -euo pipefail
          hits=$(git ls-files 'qa/*' '*/qa/ai/core/*' || true)
          if [ -n "${hits}" ]; then
            echo "::error::Engine source files are tracked in a PUBLIC repo: ${hits}"
            exit 1
          fi
          echo "clean: no engine source files tracked"

      - name: No code importing engine modules
        run: |
          set -euo pipefail
          if git grep -nE "(require|from)[[:space:]]*\(?['\"][^'\"]*qa/ai/core" -- '*.js' '*.mjs' '*.html' ':(exclude).github/**'; then
            echo "::error::Public site code imports an engine module path."
            exit 1
          fi
          echo "clean: no engine imports"

      # docs/AUDIT-*.md is gitignored precisely because this repo is deployed.
      # An ignore rule protects nothing once a file is already tracked, and
      # `git add -f` is one keystroke.
      - name: No private audit documents tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files 'docs/AUDIT-*.md' || true)
          if [ -n "${tracked}" ]; then
            echo "::error::Private audit document is tracked and would be published: ${tracked}"
            exit 1
          fi
          echo "clean: no audit documents tracked"

      # Agent context and Cursor rules are local-only for the same reason.
      - name: No agent context tracked
        run: |
          set -euo pipefail
          tracked=$(git ls-files 'CLAUDE.md' '.cursor' '.cursor/**' || true)
          if [ -n "${tracked}" ]; then
            echo "::error::Local-only agent context is tracked and would be served: ${tracked}"
            exit 1
          fi
          echo "clean: no agent context tracked"

      # Secret-shaped strings. Narrow on purpose — a noisy pattern here would be
      # switched off within a month.
      - name: No secret-shaped strings
        run: |
          set -euo pipefail
          if git grep -nE '(ghp_|github_pat_|whsec_|sk_live_|rk_live_|BEGIN [A-Z ]*PRIVATE KEY)[A-Za-z0-9_-]*' -- . ':(exclude).github/**'; then
            echo "::error::Secret-shaped string found in a public repo. Rotate it before doing anything else — see QA_Package/automation/SECRET_ROTATION.md."
            exit 1
          fi
          echo "clean: no secret-shaped strings"

      # The legal pages are linked from the footer of both public pages and are
      # cited in the security questionnaire and the counsel pack. A rename that
      # 404s them is a compliance regression, not a broken link.
      - name: Legal pages present
        run: |
          set -euo pipefail
          for f in privacy.html terms.html index.html deployshield.html 404.html _headers robots.txt; do
            [ -f "$f" ] || { echo "::error::missing required public file: $f"; exit 1; }
          done
          echo "ok: all required public files present"

      # The deploy allowlist. `.gitignore` and the `_redirects` dotfile guard both
      # name what must NOT ship; scripts/build-dist.sh names what must. Four
      # tracked files were named by neither and were serving 200 on 2026-08-11 —
      # README.md, .gitignore, this workflow, and showcase/live-ae/README.md.
      #
      # What this defends is the direction of the default. A step that only
      # checked "the pages are present" would pass just as happily on the old
      # opt-out behaviour, so the exclusion and fail-closed cases below matter
      # more than the inclusion one.
      - name: Deploy allowlist ships the site and nothing else
        run: |
          set -euo pipefail
          DIST=dist bash scripts/build-dist.sh

          for p in README.md .gitignore .github .cursor .claude notes scripts \
                   CLAUDE.md .env showcase/live-ae/README.md; do
            [ -e "dist/$p" ] && { echo "::error::$p must never ship"; exit 1; }
          done

          # Pages reads _headers and _redirects from the OUTPUT directory. Losing
          # either breaks no page: the CSP or the dotfile guard just stops
          # applying, and everything still renders.
          for f in index.html deployshield.html privacy.html terms.html 404.html \
                   _headers _redirects robots.txt sitemap.xml \
                   showcase/live-ae/exec-narrative.md \
                   showcase/live-ae/triage-report.json; do
            [ -f "dist/$f" ] || { echo "::error::dist is missing $f"; exit 1; }
          done

          # Nothing untracked may reach the deploy. cp -R copies from the working
          # tree, not from git, so this is the check that would catch a stray file
          # a clean CI checkout happens not to have.
          git ls-files | sort > /tmp/tracked
          (cd dist && find . -type f | sed 's|^\./||' | sort) > /tmp/shipped
          extra=$(comm -13 /tmp/tracked /tmp/shipped)
          [ -z "$extra" ] || { echo "::error::untracked files in dist: $extra"; exit 1; }

          echo "ok: dist ships $(find dist -type f | wc -l | tr -d ' ') tracked file(s)"

      # Negative control. Without it every assertion above still passes on a
      # script that silently skipped whatever it could not find, and the site
      # deploys half-built with a 404 where /privacy used to be.
      - name: Build refuses an incomplete site
        run: |
          set -euo pipefail
          fake=$(mktemp -d)
          mkdir -p "$fake/scripts" "$fake/assets" "$fake/contract" "$fake/showcase"
          cp scripts/build-dist.sh "$fake/scripts/"
          for d in assets contract showcase; do : > "$fake/$d/placeholder.txt"; done
          # index.html deliberately absent.
          for f in deployshield.html privacy.html terms.html 404.html \
                   _headers _redirects robots.txt sitemap.xml; do : > "$fake/$f"; done
          if DIST="$fake/dist" bash "$fake/scripts/build-dist.sh" 2>"$fake/err"; then
            echo "::error::a missing page must fail the build"; exit 1
          fi
          grep -q 'MISSING file index.html' "$fake/err" \
            || { echo "::error::wrong failure reason:"; cat "$fake/err"; exit 1; }
          [ -e "$fake/dist" ] && { echo "::error::a refused build left a partial dist"; exit 1; }
          echo "ok: build fails closed and leaves nothing behind"

      # Every inline script must be allow-listed by hash in _headers, or the CSP
      # silently drops it. Nothing about a blocked inline script is visible from
      # the server side: the page still returns 200 and still looks right at a
      # glance. Found on 2026-08-03 — privacy.html and terms.html share a footer
      # script whose hash is not among the three in _headers, so the copyright
      # year has been rendering blank on both legal pages. That is cosmetic; the
      # same failure on a page that does real work is not, and it would be just
      # as invisible.
      # 2026-09-06: the walk is recursive. The original `readdirSync(".")` only saw
      # root-level pages, so showcase/live-ae/player.html shipped with an inline
      # script no hash covered — its scene rail and transcript were dead on the
      # live site, inside an iframe on the homepage, and this check said "ok".
      # Inline scripts are now extracted to external files (script-src 'self'),
      # so the expected count here is zero; the hash path stays for any future
      # exception, but it must be allow-listed or the build fails.
      - name: Inline scripts are hash-allowlisted in the CSP
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const headers = fs.readFileSync("_headers", "utf8");
            const allowed = new Set([...headers.matchAll(/'"'"'sha256-([A-Za-z0-9+\/=]+)'"'"'/g)].map((m) => m[1]));
            const SKIP = new Set([".git", "node_modules", "dist", ".cursor", ".claude"]);
            const pages = [];
            (function walk(dir) {
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                if (SKIP.has(ent.name)) continue;
                const p = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(p);
                else if (ent.name.endsWith(".html") && !ent.name.endsWith(".draft.html")) pages.push(p); // *.draft.html is gitignored, never published
              }
            })(".");
            let bad = 0;
            for (const page of pages) {
              const html = fs.readFileSync(page, "utf8");
              for (const [, body] of html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)) {
                const hash = crypto.createHash("sha256").update(body, "utf8").digest("base64");
                if (!allowed.has(hash)) {
                  console.error(`${page}: inline script not allow-listed — add '"'"'sha256-${hash}'"'"' to the CSP in _headers`);
                  bad++;
                }
              }
            }
            if (bad) process.exit(1);
            console.log(`ok: every inline script across ${pages.length} page(s) is hash-allowlisted`);
          '

      # The standing rule is that certusqa.com never links to the Access-gated
      # ops console. Naming the host in prose is a deliberate disclosure; an
      # anchor is the thing the rule forbids.
      - name: No link to the private ops console
        run: |
          set -euo pipefail
          if grep -rnE '<a[^>]+href="[^"]*app\.certusqa\.com' --include='*.html' .; then
            echo "::error::Public site links to the private ops console."
            exit 1
          fi
          echo "clean: no anchor to the ops console"
